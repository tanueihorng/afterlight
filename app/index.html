<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Both schemes, so the canvas and native controls never paint in the wrong one before the
         stylesheet arrives. Each theme sets its own color-scheme in styles.css. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#eceef7" />
    <!-- Restore the last theme before first paint. The record (IndexedDB) loads asynchronously;
         without this, anyone not on the default theme sees it flash. Values must match ThemeId
         and THEME_COLOR in src/lib/prefs.ts. -->
    <script>
      (function () {
        var colors = {
          light: "#eceef7",
          dark: "#0b0c16",
          "hc-dark": "#000000",
          "hc-light": "#ffffff",
        };
        var theme = "light";
        try {
          var saved = localStorage.getItem("afterlight.theme");
          if (saved && colors[saved]) theme = saved;
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
        document.querySelector('meta[name="theme-color"]').setAttribute("content", colors[theme]);
      })();
    </script>
    <meta
      name="description"
      content="Afterlight — a local-first personal ophthalmology record and visual diary."
    />
    <title>Afterlight — your vision, over time</title>
      <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <!-- iOS ignores the manifest's icons for the home screen and uses this instead. Without it,
         adding Afterlight to a home screen produces a screenshot of the page. -->
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Afterlight" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
