name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Verify (types, lint, invariants, tests, build, bundle budget)
        run: npm run verify

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: afterlight-dist
          path: app/dist
          retention-days: 7

  e2e:
    # Desktop and phone run on separate runners: each is one long serial run of pages that
    # render in software GL, and side by side on one machine they starve each other (V-107).
    name: e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.project == 'desktop' && 'chromium' || 'webkit' }}

      - name: End-to-end, ${{ matrix.project }} (including offline)
        run: npm run e2e -- --project=${{ matrix.project }}

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: app/playwright-report
          retention-days: 7
