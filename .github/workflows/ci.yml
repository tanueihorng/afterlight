name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Verify (types, lint, invariants, tests, build)
        run: npm run verify

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: afterlight-dist
          path: app/dist
          retention-days: 7
